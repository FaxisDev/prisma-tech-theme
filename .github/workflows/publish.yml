# Publica Prisma-Tech en el Marketplace de VS Code al subir una etiqueta de versión.
#   1. Sube "version" en package.json (por ejemplo, 0.3.1) y haz commit.
#   2. git tag v0.3.1 && git push origin main --tags
# Necesita el secreto VSCE_PAT: token de Azure DevOps con el permiso Marketplace → Manage.
name: Publicar en el Marketplace

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Comprobar que la etiqueta coincide con package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión $VERSION de package.json"
            exit 1
          fi

      - name: Regenerar el tema con los colores por defecto
        run: npm run build

      - name: Empaquetar
        run: npx --yes @vscode/vsce@3 package --no-dependencies

      - name: Publicar en el Marketplace
        run: npx --yes @vscode/vsce@3 publish --no-dependencies --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Adjuntar el .vsix a la release de GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
