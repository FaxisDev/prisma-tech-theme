<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232B31"/>
      <stop offset="1" stop-color="#14191D"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.56" r="0.46">
      <stop offset="0" stop-color="#61FFCA" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#5CDFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#5CDFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0.1" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0" stop-color="#61FFCA"/>
      <stop offset="0.35" stop-color="#5CDFFF"/>
      <stop offset="0.7" stop-color="#ACA0FF"/>
      <stop offset="1" stop-color="#F77BFF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#C4EAFF" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#5CDFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ACA0FF" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#E6F6FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <circle cx="512" cy="580" r="470" fill="url(#halo)"/>
    <path d="M70 600 L350 524" stroke="url(#beam)" stroke-width="22" stroke-linecap="round" filter="url(#softglow)"/>
    <g stroke-linecap="round" filter="url(#softglow)">
      <path d="M666 498 L960 330" stroke="#FF4D5E" stroke-width="20"/>
      <path d="M670 506 L962 412" stroke="#FFA31A" stroke-width="20"/>
      <path d="M674 514 L964 494" stroke="#FFD21F" stroke-width="20"/>
      <path d="M676 522 L964 576" stroke="#61FFCA" stroke-width="20"/>
      <path d="M678 530 L962 658" stroke="#5CDFFF" stroke-width="20"/>
      <path d="M680 538 L960 740" stroke="#ACA0FF" stroke-width="20"/>
      <path d="M682 546 L956 822" stroke="#F77BFF" stroke-width="20"/>
    </g>
    <path d="M512 196 L800 760 L224 760 Z" fill="url(#glass)"/>
    <path d="M512 196 L800 760 L224 760 Z" fill="none" stroke="url(#edge)" stroke-width="40" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M500 290 L320 650" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="12" stroke-linecap="round"/>
    <path d="M350 524 L668 530" stroke="#E6F6FF" stroke-opacity="0.55" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
